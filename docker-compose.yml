version: '3.8'

services:
  # Signaling Server (WebSocket)
  signaling:
    build:
      context: ./server/signaling
      dockerfile: Dockerfile
    ports:
      - "${SIGNALING_PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Session Service (REST API)
  session:
    build:
      context: ./server/session
      dockerfile: Dockerfile
    ports:
      - "${SESSION_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pgp_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-this-secret}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Browser Client (Static SvelteKit)
  browser:
    build:
      context: ./browser-client
      dockerfile: Dockerfile
      args:
        - VITE_SIGNALING_URL=${VITE_SIGNALING_URL:-ws://localhost:8080}
        - VITE_SESSION_URL=${VITE_SESSION_URL:-http://localhost:3000}
    ports:
      - "80:80"
    restart: unless-stopped

  # Redis (Session Store & Pub/Sub)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # PostgreSQL (User Data)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=pgp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # TURN Server for WebRTC NAT Traversal
  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    environment:
      - DETECT_EXTERNAL_IP=yes
      - DETECT_RELAY_IP=yes
    command: >
      -n --log-file=stdout --min-port=49152 --max-port=49200 --realm=pgp.local --fingerprint --lt-cred-mech --user=pgp:pgppassword
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:


networks:
  default:
    name: pgp-network
